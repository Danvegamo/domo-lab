; Arranca el servidor MCP de Unreal solo al abrir el editor, sin tener que
; escribir "ModelContextProtocol.StartServer" en la consola cada vez.
; ModelContextProtocolSettings.h: config=EditorPerProjectUserSettings, asi
; que esto es el valor de arranque; si el usuario lo cambia desde Project
; Settings > Model Context Protocol, su copia personal en
; Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini manda sobre
; este default.
;
; ServerPortNumber NO es el 8000 por defecto del plugin: en esta maquina el
; rango 7929-8028 esta reservado por Windows (casi seguro NAT de Hyper-V,
; que usan WSL2/Docker Desktop -- ver "netsh int ipv4 show excludedportrange
; protocol=tcp"), y el 8000 cae justo ahi. Se comprobo con un bind manual
; (System.Net.Sockets.TcpListener) que 8000 falla con WSAEACCES ("Intento de
; acceso a un socket no permitido por sus permisos de acceso") incluso sin
; Unreal de por medio, y que 8090 sí liga bien. Por eso el puerto real de
; este proyecto es 8090, no el 8000 de fabrica.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8090
ServerUrlPath=/mcp
