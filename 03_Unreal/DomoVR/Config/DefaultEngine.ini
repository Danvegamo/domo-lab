;; Realismo (18 sep 2026, ver 04_Docs/02_Sala_Unreal.md seccion "Realismo"):
;; TSR como anti-aliasing (4), Lumen con trazado de rayos por hardware
;; (RTX 3090; DX12 SM6 mas abajo) para GI y reflejos, Nanite en las mallas
;; estaticas de la sala. Estos son los valores del preset "VR"; el preset
;; "Render" (domo.Preset Render o -DomoPreset=Render) sube la resolucion y
;; usa hit lighting para las capturas.
r.AntiAliasingMethod=4
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.Nanite.ProjectEnabled=True
r.VirtualTextures=True
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=0
r.RayTracing.Shadows=False

