; Cvars de arranque relacionados con la ruta VR (OpenXR + SteamVR + Virtual Desktop).
; Instanced stereo reduce el costo de dibujar dos ojos; el resto son valores por
; defecto razonables para un HMD binocular normal, no de tipo "mobile multiview".

[ConsoleVariables]
vr.InstancedStereo=1
; La cupula es el cielo que captura el SkyLight en tiempo real. Por defecto la
; captura se reparte en ~12 cuadros (timesliced): al cambiar de contenido la
; sala tardaba en tomar el color nuevo y quedaba tenida del anterior (el
; "bug verde": sala verde del patron con 3gracias ya en la cupula). Con 0 se
; recaptura entera cada cuadro.
r.SkyLight.RealTimeReflectionCapture.TimeSlice=0

